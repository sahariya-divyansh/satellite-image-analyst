name: Bug Report
description: Create a report to help us improve satellite-image-analyst
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please provide reproducible details below.
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of satellite-analyst are you using? (Run `satellite-analyst --version`)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps or Python code to reproduce the issue.
      placeholder: |
        1. Query: "Show water body change in Raipur between 2023 and 2025"
        2. Execute CLI or API query
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Traceback
      description: Please copy and paste any relevant log output or stack trace.
      render: shell
