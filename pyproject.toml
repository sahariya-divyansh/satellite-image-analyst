[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satellite-analyst"
version = "0.1.0"
description = "Natural-Language Satellite Image Analyst: query-driven Earth observation pipelines with grounded verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Satellite Analyst Contributors" }
]
keywords = [
    "earth-observation",
    "remote-sensing",
    "sentinel-2",
    "stac",
    "geospatial",
    "water-change-detection",
    "mndwi",
    "llm-planner"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pystac-client>=0.7.5",
    "planetary-computer>=1.0.0",
    "xarray>=2024.2.0",
    "rioxarray>=0.15.5",
    "rasterio>=1.3.9",
    "geopandas>=0.14.3",
    "shapely>=2.0.3",
    "pyproj>=3.6.1",
    "scikit-image>=0.22.0",
    "scipy>=1.12.0",
    "geopy>=2.4.1",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2.3.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
    "types-tabulate>=0.9.0"
]
experimental = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.38.0"
]

[project.scripts]
satellite-analyst = "satellite_analyst.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/satellite_analyst"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # unused arguments
    "SIM"  # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
    "B008"  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["satellite_analyst"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
disallow_any_generics = false

# Geospatial and third-party packages lacking full inline stubs
[[tool.mypy.overrides]]
module = [
    "planetary_computer.*",
    "pystac_client.*",
    "rioxarray.*",
    "rasterio.*",
    "geopandas.*",
    "shapely.*",
    "pyproj.*",
    "scipy.*",
    "skimage.*",
    "geopy.*",
    "xarray.*",
    "tabulate.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: marks tests requiring external services or long execution",
    "network: marks tests that issue real network requests"
]

[tool.coverage.run]
source = [
    "src/satellite_analyst/analysis",
    "src/satellite_analyst/planner",
]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
